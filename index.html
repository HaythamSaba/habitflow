<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="HabitFlow is a habit tracker that rewards showing up every day: one-tap check-ins, streaks, points, levels, achievements and progress charts." />
  <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

  <!-- Link previews (LinkedIn, Slack, iMessage…). Crawlers need absolute URLs. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HabitFlow" />
  <meta property="og:title" content="HabitFlow – Build better habits" />
  <meta property="og:description"
    content="A habit tracker that rewards showing up every day: one-tap check-ins, streaks, levels and achievements." />
  <meta property="og:url" content="https://habitflow-hs.vercel.app/" />
  <meta property="og:image" content="https://habitflow-hs.vercel.app/logo.png" />
  <meta property="og:image:alt" content="HabitFlow logo" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
    rel="stylesheet">
  <title>HabitFlow – Build better habits</title>
  <!--
    Apply the theme before first paint so dark-mode users don't see a light
    flash while the app loads. Must match getInitialTheme() in
    src/contexts/ThemeContext.tsx: saved choice, else the OS preference.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
